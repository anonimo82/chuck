name: Linux - Build & Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-build-unit-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Dependencies - Linux
      run: sudo apt update && sudo apt install --fix-missing -y libsndfile1-dev libpulse-dev libasound2-dev libmagickwand-dev pkg-config librsvg2-dev libcairo2-dev libassimp-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev ffmpeg

    - name: Compile - Linux
      run: cd src/ && make -j linux-pulse
      
    - name: Unit Tests - Linux
      run: cd src/ && export PATH=$PATH:$(pwd) && cd test/ && python test.py

    - name: Fetch MIDI dependency
      run: git clone --depth 1 https://github.com/craigsapp/midifile.git "$RUNNER_TEMP/midifile"

    - name: Build and test all multimedia Chugins
      run: make -C tools/multimedia test MIDIFILE="$RUNNER_TEMP/midifile"
