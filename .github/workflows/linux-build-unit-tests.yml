name: Linux - Build & Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-build-unit-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Dependencies - Linux
      run: sudo apt update && sudo apt install --fix-missing -y libsndfile1-dev libpulse-dev libasound2-dev libmagickwand-dev pkg-config

    - name: Compile - Linux
      run: cd src/ && make -j linux-pulse
      
    - name: Unit Tests - Linux
      run: cd src/ && export PATH=$PATH:$(pwd) && cd test/ && python test.py

    - name: Build RasterIO and run smoke test
      run: |
        make -C tools/multimedia/raster
        python3 tools/multimedia/raster/test_raster.py

    - name: Build AudioIO and run smoke test
      run: |
        make -C tools/multimedia/audio
        python3 tools/multimedia/audio/test_audio.py
